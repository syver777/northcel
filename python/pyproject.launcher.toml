[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncel"
version = "0.2.1"
description = "NorthCel (.ncel) one-command CLI: runs the native MoonBit + Bend/HVM2 + GLSL runtime when the platform supports it, and says so plainly when it does not."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "North Noir" }]
keywords = [
  "ncel",
  "northcel",
  "ai-drawn-video",
  "animation",
  "hand-drawn",
  "moonbit",
  "bend",
  "glsl",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "northcel==0.2.1",
  "ncel-native==0.2.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://northnoir.com/northcel"
Documentation = "https://northnoir.com/northcel"
Repository = "https://github.com/syver777/NorthNoir/tree/main/packaging"

[project.scripts]
ncel = "ncel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ncel*"]

[tool.setuptools.package-data]
ncel = ["data/*.ncel", "data/*.json", "data/*.md"]
