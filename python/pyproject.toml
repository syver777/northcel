[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "northcel"
version = "0.7.1"
description = "NorthCel (.ncel) — the open drawing language for AI-drawn video: reference parser, validator, formatter and CPU renderer, plus the one-command CLI that runs the native MoonBit + Bend/HVM2 + GLSL runtime when the platform supports it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "NorthCel contributors" }]
keywords = [
  "northcel",
  "ncel",
  "ai-drawn-video",
  "animation",
  "hand-drawn",
  "moonbit",
  "bend",
  "glsl",
  "dsl",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "northcel-native==0.4.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1.0", "twine>=5"]
fit = ["opencv-python-headless==5.0.0.93; python_version >= '3.11'", "opencv-python-headless==4.11.0.86; python_version < '3.11'", "scikit-image==0.26.0; python_version >= '3.11'", "scikit-image==0.24.0; python_version < '3.11'"]
# Optional perception helpers. SAM 2 itself is installed from its upstream git
# repository (it is not on PyPI); VTracer, PyTorch (SAM 2/RAFT) and TensorFlow
# (FILM SavedModels) are the PyPI-installable parts. SAM 3 is deliberately NOT
# included: it uses Meta's custom SAM License, so it stays external opt-in.
perceive = ["vtracer==0.6.11", "torch>=2.4", "torchvision>=0.19", "tensorflow>=2.16"]
# Vello tolerance renderer. Ships as per-platform wheels of `northcel-vello`.
vello = ["northcel-vello==0.7.0"]

[project.urls]
Homepage = "https://github.com/syver777/northcel"
Documentation = "https://github.com/syver777/northcel/tree/main/docs"
Repository = "https://github.com/syver777/northcel"
Changelog = "https://github.com/syver777/northcel/blob/main/CHANGELOG.md"
Issues = "https://github.com/syver777/northcel/issues"
"Language specification" = "https://github.com/syver777/northcel/blob/main/docs/spec/SPEC-0.5.0-draft.md"

[project.scripts]
# One install, one implementation switch. Both names reach the launcher, which
# runs the native runtime when it can and the labelled Python reference when it
# cannot. `ncel` is only a short alias for `northcel`.
northcel = "northcel.launcher.cli:main"
ncel = "northcel.launcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["northcel*"]

[tool.setuptools.package-data]
northcel = [
  "AGENT-GUIDE.md",
  "examples/*.ncel",
  "conformance/*.ncel",
  "conformance/*.json",
  "data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
