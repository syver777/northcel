[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncel-native"
version = "0.4.0"
description = "DEPRECATED ALIAS — the native NorthCel runtime ships as `northcel-native` now. This package only depends on the real one."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "NorthCel contributors" }]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "northcel-native==0.4.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Homepage = "https://github.com/syver777/northcel"
Repository = "https://github.com/syver777/northcel"

[tool.setuptools]
packages = ["ncel_native_alias"]
