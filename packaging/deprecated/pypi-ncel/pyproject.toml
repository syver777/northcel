[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncel"
version = "0.6.1"
description = "DEPRECATED ALIAS — NorthCel is installed as `northcel` now. This package only depends on the real one."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "NorthCel contributors" }]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["northcel==0.6.1"]

[project.urls]
Homepage = "https://github.com/syver777/northcel"
Repository = "https://github.com/syver777/northcel"

[tool.setuptools]
packages = ["ncel_alias"]
