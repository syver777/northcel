name: Vello wheels

# Builds the optional `northcel-vello` extension for every supported platform.
# The Python reference stays the exact tier; these wheels are the tolerance tier
# and are not required for core NorthCel.
on:
  push:
    branches: [main]
    paths:
      - "native/vello/**"
      - "native/vello-python/**"
      - ".github/workflows/vello.yml"
  pull_request:
    paths:
      - "native/vello/**"
      - "native/vello-python/**"
      - ".github/workflows/vello.yml"
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-13
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build the wheel (manylinux container)
        if: startsWith(matrix.os, 'ubuntu')
        uses: PyO3/maturin-action@v1
        with:
          working-directory: native/vello-python
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked -o ../../dist/vello
      - name: Build the wheel (native host toolchain)
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        working-directory: native/vello-python
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --locked --target "${{ matrix.target }}" -o ../../dist/vello
      - name: Import the built wheel (no GPU needed)
        shell: bash
        run: |
          python -m pip install dist/vello/*.whl
          python -c "import northcel_vello; print(northcel_vello.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: northcel-vello-${{ matrix.name }}
          path: dist/vello/*.whl
      - name: Renderer conformance (macOS runner with Metal)
        if: matrix.name == 'macos-x86_64'
        shell: bash
        run: |
          python -m pip install numpy Pillow
          python -m pip install --no-deps -e ./python
          PYTHONPATH=python python tests/conformance.py --vello

  publish:
    name: publish to PyPI
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v0.7')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: northcel-vello-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
